name: Dart
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart pub get
        working-directory: validation/contracts_03
      - run: dart format --output=none --set-exit-if-changed lib test example benchmark validation
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run benchmark/learning_stability.dart --smoke > /tmp/learning-smoke.json
      - run: dart analyze --fatal-infos
        working-directory: validation/contracts_03
      - run: dart run main.dart
        working-directory: validation/contracts_03
      - run: dart run example/reinforcement_engine_example.dart
      - run: dart run example/custom_extensions.dart
      - run: dart run example/checkpoint.dart
      - run: dart compile js example/checkpoint.dart -o /tmp/checkpoint.js
      - run: node /tmp/checkpoint.js
      - run: dart run example/persistence.dart
      - run: dart run example/evaluation.dart
      - run: dart run example/exploration.dart
      - run: dart run example/continuing.dart
      - run: dart run example/eligibility_traces.dart
      - run: dart compile js example/continuing.dart -o /tmp/continuing.js
      - run: dart compile js example/eligibility_traces.dart -o /tmp/traces.js
      - run: node /tmp/continuing.js
      - run: node /tmp/traces.js
      - run: dart compile js example/exploration.dart -o /tmp/exploration.js
      - run: node /tmp/exploration.js
      - run: dart compile js example/evaluation.dart -o /tmp/evaluation.js
      - run: node /tmp/evaluation.js
      - run: dart compile js example/custom_extensions.dart -o /tmp/extensions.js
      - run: dart compile js example/persistence.dart -o /tmp/persistence.js
      - run: node /tmp/extensions.js
      - run: node /tmp/persistence.js
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example/flutter_lab
      - run: flutter analyze --fatal-infos
        working-directory: example/flutter_lab
      - run: flutter test
        working-directory: example/flutter_lab
      - run: flutter build web
        working-directory: example/flutter_lab
